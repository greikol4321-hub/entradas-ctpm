name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pip-audit
      - name: Lint (ruff)
        run: ruff check . --exclude="tests,supabase,static" || true
      - name: Format check
        run: ruff format --check . --exclude="tests,supabase,static" || true
      - name: Security audit
        run: pip-audit -r requirements.txt || true
      - name: Tests (opcional)
        env:
          FLASK_SECRET: test-secret-ci
          DATABASE_URL: ""  # tests mock DB
        run: pytest -q || echo "no tests — skipped"
